appId: com.inboxscout.app
productName: InboxScout
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
win:
  # Stable names so the README's "latest" links never go stale.
  artifactName: InboxScout-Setup.${ext}
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  artifactName: InboxScout-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
publish:
  provider: github
  owner: thatcooperguy
  repo: inboxscout
  releaseType: release
npmRebuild: true
