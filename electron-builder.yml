appId: com.inboxscout.app
productName: InboxScout
copyright: "Copyright © 2026 Cooper Studios LLC"
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
  # Offline OCR (reads photos and scans): the WASM engine, its worker, and the English data must be real files on disk.
  - "node_modules/tesseract.js/**"
  - "node_modules/tesseract.js-core/**"
  - "node_modules/@tesseract.js-data/**"
win:
  # Stable names so the README's "latest" links never go stale.
  artifactName: InboxScout-Setup.${ext}
  target:
    - nsis
  # Code signing with Azure Trusted Signing (docs/SIGNING.md). electron-builder calls build/sign.js for the app exe,
  # the installer and the uninstaller before it hashes the installer into latest.yml. The hook no-ops when the
  # AZURE_* secrets are absent, so a build without them is unsigned — exactly as before.
  signtoolOptions:
    sign: ./build/sign.js
    # Trusted Signing certificates are SHA-256 only; the default (sha1 + sha256) would call the hook twice per file.
    signingHashAlgorithms:
      - sha256
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  artifactName: InboxScout-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  # Signing + notarization with a Developer ID certificate (docs/SIGNING.md). Everything below only takes effect when
  # electron-builder finds a certificate (CSC_LINK in the release workflow); without one it logs "skipped macOS
  # application code signing" and never reads the entitlements. `notarize: true` is itself gated on the
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID environment — absent, notarization is skipped with a warning.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
linux:
  # electron-builder expands ${arch} to "x86_64" for AppImage and "amd64" for .deb on Linux,
  # so the arch is spelled out to keep the README's "latest" links stable:
  # InboxScout-x64.AppImage and InboxScout-x64.deb. (Icon: build/icon.png, shared by every OS.)
  artifactName: InboxScout-x64.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  synopsis: Know what needs you. Skip the rest.
  description: A free desktop app that reads your email (read-only) and hands you a 30-second brief, in plain words.
  # Debian packages need a maintainer with an email address; this is the project mailbox, not a person.
  maintainer: Cooper Studios LLC <hello@inboxscout.ai>
  desktop:
    # electron-builder 26 shape: [Desktop Entry] keys live under `entry`.
    entry:
      Name: InboxScout
      Comment: Know what needs you. Skip the rest.
      Categories: Office;Email;Network;
      StartupWMClass: InboxScout
publish:
  provider: github
  owner: thatcooperguy
  repo: inboxscout
  releaseType: release
npmRebuild: true
