appId: com.inboxscout.app
productName: InboxScout
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.productivity
publish:
  provider: github
  owner: thatcooperguy
  repo: inboxscout
  releaseType: release
npmRebuild: true
