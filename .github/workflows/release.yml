name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases? 'no' builds the installers and attaches them to this run only (a dry run)."
        type: choice
        options: ['yes', 'no']
        default: 'yes'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform at a time: uploads into the draft release never race on creating it.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            artifact: Windows .exe
          - os: macos-latest
            artifact: macOS .dmg
          - os: ubuntu-latest
            artifact: Linux AppImage + .deb
    runs-on: ${{ matrix.os }}
    steps:
      # Code-signing secrets (docs/SIGNING.md) are exported into the job ONLY when they exist, and only on the
      # runner that uses them. An empty-but-defined CSC_LINK makes electron-builder look for a certificate file and
      # fail ("not a file"), so a repository without these secrets must not define the variables at all — that is
      # what keeps unsigned builds working exactly as before. Values never appear in the log (GitHub masks secrets).
      - name: Export signing secrets that exist
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_if_set() {
            local name="$1" value="${!1:-}"
            if [ -n "$value" ]; then
              { echo "$name<<__INBOXSCOUT_EOF__"; echo "$value"; echo "__INBOXSCOUT_EOF__"; } >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "$name: not set"
            fi
          }
          case "$RUNNER_OS" in
            Windows) for n in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_ENDPOINT AZURE_CODE_SIGNING_ACCOUNT_NAME AZURE_CERTIFICATE_PROFILE_NAME; do export_if_set "$n"; done ;;
            macOS) for n in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do export_if_set "$n"; done ;;
            *) echo "Linux: nothing to sign" ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

      # Prints "signing: on/off" (never a secret value). When the six AZURE_* secrets are present it also installs
      # the Trusted Signing client + a /dlib-capable signtool and fails fast if either is missing, so a broken
      # signing setup stops here instead of after the build.
      - name: Signing status (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_ENDPOINT', 'AZURE_CODE_SIGNING_ACCOUNT_NAME', 'AZURE_CERTIFICATE_PROFILE_NAME'
          $present = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($present.Count -eq $required.Count) {
            $dir = Join-Path $env:RUNNER_TEMP 'trusted-signing'
            # Pinned NuGet packages (same ones azure/trusted-signing-action installs). Needs the .NET 8 runtime, which
            # GitHub's Windows images carry. -x drops the version from the folder name.
            nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -x -OutputDirectory $dir -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw 'nuget install Microsoft.Trusted.Signing.Client failed' }
            nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.9169 -x -OutputDirectory $dir -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw 'nuget install Microsoft.Windows.SDK.BuildTools failed' }
            $dlib = Join-Path $dir 'Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
            $signtool = Get-ChildItem -Path (Join-Path $dir 'Microsoft.Windows.SDK.BuildTools') -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like '*\x64\*' } | Select-Object -First 1 -ExpandProperty FullName
            if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found under $dir" }
            if (-not $signtool) { throw "x64 signtool.exe not found under $dir" }
            "AZURE_CODE_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
            "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV
            $env:AZURE_CODE_SIGNING_DLIB = $dlib
            $env:SIGNTOOL_PATH = $signtool
          }
          node build/sign.js

      # Prints "signing: on/off" and "notarization: on/off" (never a secret value). electron-builder only searches
      # for a certificate when CSC_IDENTITY_AUTO_DISCOVERY is not "false", so it is switched on exactly when a
      # certificate (CSC_LINK) was provided; otherwise it stays off and the build is unsigned, as before.
      - name: Signing status (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "signing: on (Developer ID certificate from CSC_LINK)"
            [ -n "${CSC_KEY_PASSWORD:-}" ] || echo "::warning::CSC_KEY_PASSWORD is empty; the .p12 must have no password"
          else
            echo "signing: off (no CSC_LINK secret) — macOS builds will be unsigned"
          fi
          missing=""
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            if [ -n "${CSC_LINK:-}" ]; then
              echo "notarization: on"
            else
              echo "::warning::notarization credentials are set but there is no certificate (CSC_LINK); nothing will be notarized"
            fi
          elif [ "$missing" = " APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID" ]; then
            echo "notarization: off (no APPLE_* secrets)"
          else
            echo "::error::notarization is half-configured; missing:$missing (set all three secrets or none; see docs/SIGNING.md)"
            exit 1
          fi

      - name: Build and publish ${{ matrix.artifact }}
        # A dry run ("publish: no") packages without touching GitHub Releases; the installers are attached to the run.
        # macOS builds its two architectures one after the other so their uploads never race.
        shell: bash
        run: |
          if [ "${{ github.event.inputs.publish }}" = "no" ]; then
            npm run package
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npm run release:mac
          else
            npm run release
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: bake sign-in app IDs into official builds so nobody else needs to register apps.
          INBOXSCOUT_GOOGLE_CLIENT_ID: ${{ secrets.INBOXSCOUT_GOOGLE_CLIENT_ID }}
          INBOXSCOUT_GOOGLE_CLIENT_SECRET: ${{ secrets.INBOXSCOUT_GOOGLE_CLIENT_SECRET }}
          INBOXSCOUT_MS_CLIENT_ID: ${{ secrets.INBOXSCOUT_MS_CLIENT_ID }}
          # "true" only when the macOS status step found a certificate; otherwise unsigned builds, as before.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_IDENTITY_AUTO_DISCOVERY || 'false' }}
      - name: Attach installers (dry run only)
        if: github.event.inputs.publish == 'no'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    # Flips the draft release live once every installer is attached. Skipped on dry runs and when a build failed,
    # so a half-built release can never become "latest".
    needs: build
    if: github.event.inputs.publish != 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # Drafts are not served by /releases/tags/<tag>; find the newest release carrying this tag in the list.
          release=$(curl -sS "${auth[@]}" "$api/releases?per_page=30" | jq -c --arg tag "$tag" '[.[] | select(.tag_name==$tag)] | first')
          if [ -z "$release" ] || [ "$release" = "null" ]; then echo "::error::no release found for $tag"; exit 1; fi
          id=$(echo "$release" | jq -r .id)
          names=$(curl -sS "${auth[@]}" "$api/releases/$id/assets?per_page=100" | jq -r '.[].name')
          echo "assets on $tag:"; echo "$names" | sed 's/^/  /'
          for want in InboxScout-Setup.exe InboxScout-arm64.dmg InboxScout-x64.dmg InboxScout-x64.AppImage InboxScout-x64.deb latest.yml latest-mac.yml latest-linux.yml; do
            echo "$names" | grep -qx "$want" || { echo "::error::$tag is missing $want; leaving it as a draft"; exit 1; }
          done
          if [ "$(echo "$release" | jq -r .draft)" = "true" ]; then
            curl -sS -f -X PATCH "${auth[@]}" "$api/releases/$id" -d '{"draft":false,"make_latest":"true"}' > /dev/null
            echo "published $tag"
          else
            echo "$tag was already published"
          fi
